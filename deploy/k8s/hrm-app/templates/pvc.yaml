{{- if .Values.logs.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hrm-app.fullname" . }}-logs
  labels:
    {{- include "hrm-app.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.logs.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.logs.persistence.size }}
  {{- with .Values.logs.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
