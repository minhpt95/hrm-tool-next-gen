{{- if and .Values.secret.create (not .Values.existingSecret) -}}
{{- if not .Values.secret.data.JWT_SECRET -}}
{{- fail "secret.data.JWT_SECRET is required. Set it via --set or supply --set existingSecret=<name> to reference an externally-managed Secret." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hrm-app.fullname" . }}
  labels:
    {{- include "hrm-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
